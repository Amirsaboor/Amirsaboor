<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="About Amir"><style>text{font-family:ui-monospace,monospace}</style><rect x="1" y="1" width="998" height="278" rx="10" fill="#111a23" stroke="#35414b"/><rect x="24" y="24" width="5" height="232" rx="2" fill="#d7ff64"/><text x="54" y="60" font-size="12" fill="#d7ff64" letter-spacing="2">A LITTLE ABOUT MY WORK</text><text x="54" y="111" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#f3f5f7">Thoughtful by design.</text><text x="54" y="151" font-size="14" fill="#aab5c0">I turn product ideas into polished, responsive web</text><text x="54" y="176" font-size="14" fill="#aab5c0">experiences with React and Next.js. I enjoy the craft</text><text x="54" y="201" font-size="14" fill="#aab5c0">of clean components, considered details, and interfaces</text><text x="54" y="226" font-size="14" fill="#aab5c0">that stay fast and maintainable as they grow.</text><g transform="translate(690 48)"><rect width="260" height="184" rx="8" fill="#182631" stroke="#3a4b58"/><text x="20" y="31" font-size="11" fill="#8293a1">MY PRINCIPLES</text><path d="M20 44H240" stroke="#35414b"/><g font-size="13" fill="#f3f5f7"><text x="20" y="77"><tspan fill="#d7ff64">01</tspan>  Useful over flashy</text><text x="20" y="111"><tspan fill="#d7ff64">02</tspan>  Consistency over noise</text><text x="20" y="145"><tspan fill="#d7ff64">03</tspan>  Details matter</text></g><circle cx="231" cy="163" r="4" fill="#d7ff64"/></g></svg>