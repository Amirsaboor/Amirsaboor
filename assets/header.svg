<svg xmlns="http://www.w3.org/2000/svg" width="650" height="280" viewBox="0 0 650 280" role="img" aria-label="Amir Saboor — Frontend Developer">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0D1117"/><stop offset="1" stop-color="#17232E"/></linearGradient>
 <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F0FF9B"/><stop offset="1" stop-color="#B8E94A"/></linearGradient>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8293A1" stroke-opacity=".12"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<style>
 text{font-family:ui-monospace,'SFMono-Regular',Consolas,monospace}.headline{font-family:Arial,Helvetica,sans-serif;font-weight:800;letter-spacing:-3px}
 .in{opacity:0;animation:in .75s ease forwards}@keyframes in{to{opacity:1}}
 @keyframes orbit{to{transform:rotate(360deg)}}.orbit{transform-origin:812px 135px;animation:orbit 36s linear infinite}
 @media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
<rect x="1" y="1" width="648" height="278" rx="14" fill="url(#bg)" stroke="#35414B"/>
<rect x="1" y="1" width="998" height="278" rx="14" fill="url(#grid)"/>
<text x="52" y="48" font-size="11" letter-spacing="2.5" fill="#D7FF64">PORTFOLIO / 2026</text>
<path d="M52 63H170" stroke="#D7FF64" stroke-width="2"/>
<text class="headline in" x="48" y="139" font-size="76" fill="#F3F5F7" style="animation-delay:.12s">Amir <tspan fill="#D7FF64">Saboor.</tspan></text>
<text class="in" x="55" y="179" font-size="17" font-weight="700" fill="#F3F5F7" style="animation-delay:.28s">Frontend Developer</text>
<text class="in" x="55" y="208" font-size="14" fill="#AAB5C0" style="animation-delay:.4s">Engineering thoughtful digital experiences.</text>
<g class="in" style="animation-delay:.56s"><rect x="55" y="232" width="9" height="9" rx="2" fill="#D7FF64"/><text x="76" y="241" font-size="11" letter-spacing="1.4" fill="#D7FF64">REACT  /  NEXT.JS  /  TYPESCRIPT</text></g>
<text x="610" y="262" text-anchor="end" font-size="9" letter-spacing="2" fill="#8293A1">AS — 001</text>
</svg>