<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Amir Saboor, Frontend Developer">
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#d7ff64" opacity=".2"/></pattern><linearGradient id="panel" x2="1" y2="1"><stop stop-color="#17232e"/><stop offset="1" stop-color="#10161e"/></linearGradient></defs>
<style>text{font-family:ui-monospace,'SFMono-Regular',monospace}.display{font-family:Arial,sans-serif}.rise{opacity:0;animation:rise .8s ease forwards}@keyframes rise{to{opacity:1;transform:translateY(0)}}@keyframes sweep{to{stroke-dashoffset:-120}}.line{stroke-dasharray:8 8;animation:sweep 16s linear infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}</style>
<rect x="1" y="1" width="998" height="298" rx="10" fill="url(#panel)" stroke="#35414b"/><rect x="1" y="1" width="998" height="298" rx="10" fill="url(#dots)"/>
<path d="M690 0L1000 0 1000 300 820 300Z" fill="#d7ff64" opacity=".045"/><path d="M725 0L1000 0 1000 300 910 300Z" fill="#8d9eff" opacity=".055"/>
<path d="M650 30L950 270M690 15L990 255M730 0L1000 216" stroke="#d7ff64" stroke-opacity=".28" stroke-width="1" class="line"/>
<text x="54" y="52" font-size="13" fill="#d7ff64" letter-spacing="2">INDEPENDENT FRONTEND DEVELOPER</text>
<text class="display rise" x="50" y="139" font-size="72" font-weight="800" letter-spacing="-3" fill="#f3f5f7" style="transform:translateY(12px);animation-delay:.15s">Amir Saboor</text>
<path d="M55 158H410" stroke="#d7ff64" stroke-width="3"/>
<text class="rise" x="56" y="198" font-size="21" font-weight="700" fill="#f3f5f7" style="transform:translateY(12px);animation-delay:.3s">I build interfaces that feel effortless.</text>
<text class="rise" x="56" y="230" font-size="15" fill="#aab5c0" style="transform:translateY(12px);animation-delay:.45s">React / Next.js / TypeScript / UI Engineering</text>
<g transform="translate(56 258)"><rect width="12" height="12" rx="3" fill="#d7ff64"/><text x="23" y="11" font-size="12" fill="#d7ff64" letter-spacing="1">AVAILABLE FOR GREAT IDEAS</text></g>
<text class="display" x="835" y="204" font-size="150" font-weight="800" letter-spacing="-14" text-anchor="middle" fill="none" stroke="#d7ff64" stroke-width="2" opacity=".9">AS</text>
<text x="944" y="278" font-size="10" fill="#7d8994" text-anchor="end">PROFILE / 2026</text>
