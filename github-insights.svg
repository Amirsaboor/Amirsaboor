    <rect x="28" y="28" width="175.5" height="92" rx="12" fill="#182631" stroke="#35414B"/>
    <rect x="44" y="28" width="36" height="3" rx="1.5" fill="#D7FF64"/>
    <text x="44" y="80" class="big" fill="#FFFFFF">11</text>
    <text x="44" y="102" class="lbl" fill="#8B949E">REPOSITORIES</text>
  </g>
  <g opacity="0">
