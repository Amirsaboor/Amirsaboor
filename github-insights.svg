  <text x="48" y="262" class="t" fill="#E6EDF3">JavaScript<tspan fill="#8B949E" dx="8">19.3%</tspan></text>
  <circle cx="282" cy="257" r="5" fill="#1572B6"/>
  <text x="296" y="262" class="t" fill="#E6EDF3">CSS<tspan fill="#8B949E" dx="8">5.8%</tspan></text>
