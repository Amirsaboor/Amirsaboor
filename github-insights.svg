    <rect x="423" y="28" width="36" height="3" rx="1.5" fill="#D7FF64"/>
    <text x="423" y="80" class="big" fill="#FFFFFF">10</text>
    <text x="423" y="102" class="lbl" fill="#8B949E">FOLLOWERS</text>
